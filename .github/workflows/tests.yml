name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check critical safeguard mutations
        run: python tools/check_mutations.py
      - name: Exercise offline CLI in a temporary directory
        run: |
          task_fixture_dir=$(mktemp -d)
          python -m email_corpus_forge plan --run "$task_fixture_dir/run"
          python -m email_corpus_forge run --run "$task_fixture_dir/run"
          python -m email_corpus_forge status --run "$task_fixture_dir/run"
          python -m email_corpus_forge export --run "$task_fixture_dir/run" --out "$task_fixture_dir/export"
      - name: Verify published dataset payloads offline
        run: |
          if [ -d datasets ]; then
            for task_dataset_dir in datasets/*; do
              [ -d "$task_dataset_dir" ] || continue
              python tools/verify_dataset.py --dataset "$task_dataset_dir"
            done
          fi
      - name: Verify published scenario designs offline
        run: |
          if [ -d scenario-plans ]; then
            for task_plan_dir in scenario-plans/*; do
              [ -d "$task_plan_dir" ] || continue
              python tools/verify_scenario_plans.py --plans "$task_plan_dir"
            done
          fi
