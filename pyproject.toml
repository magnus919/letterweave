[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-corpus-forge"
version = "0.4.0"
description = "Original, auditable English multi-label email corpus tooling"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
email-corpus-forge = "email_corpus_forge.cli:main"

[tool.setuptools]
packages = ["email_corpus_forge"]

[tool.setuptools.package-data]
email_corpus_forge = ["data/*.json"]
